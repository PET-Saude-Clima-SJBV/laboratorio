# Confere se o projeto compila a cada envio. Roda nas máquinas do GitHub (nunca no servidor do HUB).
# Se ficar vermelho no GitHub, alguém enviou algo que não compila: rode "npm run build" na sua máquina.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
